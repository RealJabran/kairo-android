name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x build-apk.sh
          ./build-apk.sh

      - name: Run Android lint
        run: ./.build-tools/gradle-9.1.0/bin/gradle :app:lintDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kairo-${{ github.sha }}
          path: output/Kairo-*.apk
          if-no-files-found: error
          retention-days: 14
